  name: Generate Issues Document

  on:
    workflow_dispatch: # Avvio manuale

  jobs:
    build-report:
      runs-on: ubuntu-latest

      permissions:
        contents: write
        checks: write
        issues: read # PERMESSO FONDAMENTALE per leggere le issue

      steps:
        - uses: actions/checkout@v4

        - name: Fetch and Format Issues
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            gh issue list \
              --repo ${{ github.repository }} \
              --state all \
              --search "created:2026-01-01..2026-08-27" \
              --limit 200 \
              --json number,title,state,createdAt,url \
              --template '## Report Issue dal 01-01-2026 al 27-08-2026

            {{range .}}- [ ] **#{{.number}}** [{{.title}}]({{.url}}) - *{{.state}}* (creato il {{.createdAt}})
            {{end}}' > ISSUES_REPORT.md

        - name: Commit Report File
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ISSUES_REPORT.md
            git commit -m "docs: aggiornato report issue" || exit 0
            git push