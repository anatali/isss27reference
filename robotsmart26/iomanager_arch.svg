<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="1060" height="640" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1060" height="640" fill="#fff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#111">System iomanager</text>

  <!-- MQTT broker -->
  <rect x="415" y="20" width="260" height="70" rx="8" fill="#f2f2f2" stroke="#222"/>
  <text x="545" y="44" font-size="13" font-weight="bold" text-anchor="middle">MQTT broker</text>
  <text x="545" y="62" font-size="11" text-anchor="middle">broker.hivemq.com : 1883</text>
  <text x="545" y="79" font-size="11" text-anchor="middle" font-style="italic">eventTopic "unibo/cargoservice"</text>

  <!-- external -->
  <rect x="790" y="28" width="240" height="54" rx="6" fill="#fff" stroke="#555" stroke-dasharray="6 4"/>
  <text x="910" y="51" font-size="12" text-anchor="middle">Sottoscrittori esterni</text>
  <text x="910" y="68" font-size="11" text-anchor="middle" font-style="italic">(es. cargoservice)</text>
  <line x1="675" y1="55" x2="788" y2="55" stroke="#222" marker-end="url(#a)"/>
  <text x="732" y="48" font-size="10" text-anchor="middle">publish</text>

  <!-- Context -->
  <rect x="170" y="150" width="720" height="330" rx="10" fill="#fafafa" stroke="#222" stroke-width="1.5"/>
  <text x="185" y="172" font-size="13" font-weight="bold">Context ctx_sonarled</text>
  <text x="185" y="189" font-size="11" fill="#333">ip [ host="localhost" port=8128 ]</text>

  <!-- actors -->
  <g font-size="13" text-anchor="middle">
    <rect x="190" y="260" width="150" height="80" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="265" y="290" font-size="10" fill="#555">QActor</text>
    <text x="265" y="308" font-weight="bold">sonarreader</text>
    <rect x="470" y="260" width="150" height="80" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="545" y="290" font-size="10" fill="#555">QActor</text>
    <text x="545" y="308" font-weight="bold">ioporthandler</text>
    <rect x="720" y="260" width="150" height="80" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="795" y="290" font-size="10" fill="#555">QActor</text>
    <text x="795" y="308" font-weight="bold">ledcontroller</text>
  </g>

  <!-- sonarreader -> ioporthandler (emitlocal) -->
  <line x1="340" y1="300" x2="468" y2="300" stroke="#222" stroke-dasharray="7 4" marker-end="url(#a)"/>
  <text x="405" y="292" font-size="10" text-anchor="middle" font-style="italic">emitlocal</text>
  <g font-size="10" text-anchor="middle">
    <text x="405" y="316">minoreDFree</text>
    <text x="405" y="329">maggioreDFree</text>
    <text x="405" y="342">minoreDFreeMezzi</text>
  </g>

  <!-- ioporthandler -> ledcontroller (emit) -->
  <line x1="620" y1="300" x2="718" y2="300" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="669" y="292" font-size="10" text-anchor="middle" font-style="italic">emit</text>
  <text x="669" y="316" font-size="10" text-anchor="middle">alarmA</text>
  <text x="669" y="329" font-size="10" text-anchor="middle">alarmOff</text>

  <!-- ioporthandler -> broker -->
  <line x1="545" y1="260" x2="545" y2="92" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="555" y="120" font-size="10" font-style="italic">emit</text>
  <text x="555" y="134" font-size="10">alarmA, alarmOff,</text>
  <text x="555" y="226" font-size="10">containerAtIoPort</text>

  <!-- annotations -->
  <g font-size="10" fill="#333" text-anchor="middle">
    <text x="265" y="372">DFree = prima misura valida</text>
    <text x="265" y="388">D &gt; DFree → maggioreDFree</text>
    <text x="265" y="402">DFree/2 ≤ D ≤ DFree → minoreDFree</text>
    <text x="265" y="416">D &lt; DFree/2 → minoreDFreeMezzi</text>
    <text x="545" y="372">FSM: listening, maggioreDFree,</text>
    <text x="545" y="386">minoreDFreeMezzi, sendAlarm,</text>
    <text x="545" y="400">resume, atIOPort</text>
    <text x="545" y="418">maggioreDFree per 3 s → alarmA</text>
    <text x="545" y="432">minoreDFreeMezzi per 3 s → containerAtIoPort</text>
    <text x="795" y="372">FSM: s0, handleTurnOn,</text>
    <text x="795" y="386">handleTurnOff</text>
  </g>

  <!-- sonar process / HW -->
  <rect x="20" y="265" width="130" height="70" rx="6" fill="#fff" stroke="#555"/>
  <text x="85" y="290" font-size="10" text-anchor="middle" fill="#555">processo OS</text>
  <text x="85" y="308" font-size="11" text-anchor="middle" font-family="Courier New, monospace">python sonar.py</text>
  <rect x="20" y="400" width="130" height="46" rx="4" fill="#f2f2f2" stroke="#555"/>
  <text x="85" y="428" font-size="12" text-anchor="middle">Sonar (HW)</text>
  <line x1="85" y1="400" x2="85" y2="337" stroke="#222" stroke-dasharray="2 3" marker-end="url(#a)"/>
  <line x1="150" y1="300" x2="188" y2="300" stroke="#222" stroke-dasharray="2 3" marker-end="url(#a)"/>
  <text x="152" y="292" font-size="10">stdout</text>

  <!-- led process / HW -->
  <rect x="910" y="265" width="140" height="70" rx="6" fill="#fff" stroke="#555"/>
  <text x="980" y="285" font-size="10" text-anchor="middle" fill="#555">processo OS</text>
  <text x="980" y="303" font-size="10" text-anchor="middle" font-family="Courier New, monospace">ledPython25On.py</text>
  <text x="980" y="318" font-size="10" text-anchor="middle" font-family="Courier New, monospace">ledPython25Off.py</text>
  <rect x="910" y="400" width="140" height="46" rx="4" fill="#f2f2f2" stroke="#555"/>
  <text x="980" y="428" font-size="12" text-anchor="middle">LED (HW)</text>
  <line x1="870" y1="300" x2="908" y2="300" stroke="#222" stroke-dasharray="2 3" marker-end="url(#a)"/>
  <text x="874" y="292" font-size="10">exec</text>
  <line x1="980" y1="337" x2="980" y2="398" stroke="#222" stroke-dasharray="2 3" marker-end="url(#a)"/>

  <!-- legend -->
  <rect x="170" y="505" width="720" height="115" rx="6" fill="#fff" stroke="#999"/>
  <text x="185" y="526" font-size="12" font-weight="bold">Legenda</text>
  <line x1="190" y1="548" x2="260" y2="548" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="272" y="552" font-size="11">emit: evento propagato nel contesto e pubblicato sul topic MQTT (eventTopic)</text>
  <line x1="190" y1="572" x2="260" y2="572" stroke="#222" stroke-dasharray="7 4" marker-end="url(#a)"/>
  <text x="272" y="576" font-size="11">emitlocal: evento visibile solo agli attori del contesto ctx_sonarled</text>
  <line x1="190" y1="596" x2="260" y2="596" stroke="#222" stroke-dasharray="2 3" marker-end="url(#a)"/>
  <text x="272" y="600" font-size="11">interazione con processi del sistema operativo (Runtime.exec, stdout) e con l'hardware</text>
</svg>
